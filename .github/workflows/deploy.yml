name: Deploy NGINX to Private EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-nginx
  IMAGE_TAG: latest

jobs:

  infrastructure:
    name: Create Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve


  push-nginx:
    name: Push NGINX to ECR
    runs-on: ubuntu-latest

    needs: infrastructure

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull NGINX
        run: docker pull nginx:latest

      - name: Tag NGINX
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker tag nginx:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push NGINX
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  deploy-ec2:
    name: Deploy NGINX to Private EC2
    runs-on: ubuntu-latest

    needs: push-nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Get EC2 Instance ID
        id: ec2
        working-directory: terraform
        run: |
          echo "instance_id=$(terraform output -raw ec2_instance_id)" >> "$GITHUB_OUTPUT"

      - name: Get ECR Repository URL
        id: ecr
        working-directory: terraform
        run: |
          echo "repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Deploy NGINX using SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          ECR_URL: ${{ steps.ecr.outputs.repository_url }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NGINX from private ECR" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(echo $ECR_URL | cut -d/ -f1)\",
              \"docker pull $ECR_URL:$IMAGE_TAG\",
              \"docker stop nginx || true\",
              \"docker rm nginx || true\",
              \"docker run -d --name nginx -p 80:80 $ECR_URL:$IMAGE_TAG\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Verify NGINX
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps --filter name=nginx"]' \
            --query "Command.CommandId" \
            --output text

      - name: Deployment complete
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          echo "=========================================="
          echo "NGINX deployment completed"
          echo "Private EC2: $INSTANCE_ID"
          echo "=========================================="
