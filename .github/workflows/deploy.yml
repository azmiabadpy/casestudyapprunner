```yaml
name: Deploy NGINX to Private EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-nginx
  IMAGE_TAG: latest

jobs:

  # =================================================

  infrastructure:
    name: Create Infrastructure
    runs-on: ubuntu-latest

    outputs:
      public_subnet_id: ${{ steps.outputs.outputs.public_subnet_id }}
      private_route_table_id: ${{ steps.outputs.outputs.private_route_table_id }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform
        run: |
          echo "public_subnet_id=$(terraform output -raw public_subnet_id)" >> "$GITHUB_OUTPUT"
          echo "private_route_table_id=$(terraform output -raw private_route_table_id)" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. PUSH NGINX IMAGE TO ECR
  # ============================================================

  push-nginx:
    name: Push NGINX to ECR
    runs-on: ubuntu-latest

    needs: infrastructure

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull NGINX
        run: |
          docker pull nginx:latest

      - name: Tag NGINX
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag nginx:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push NGINX
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ============================================================
  # 3. CREATE TEMPORARY NAT
  # ============================================================

  temporary-nat:
    name: Create Temporary NAT for Outbound Access
    runs-on: ubuntu-latest

    needs: infrastructure

    outputs:
      nat_gateway_id: ${{ steps.nat.outputs.nat_gateway_id }}
      allocation_id: ${{ steps.eip.outputs.allocation_id }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Network Information
        id: network
        working-directory: terraform
        run: |
          terraform init

          echo "public_subnet_id=$(terraform output -raw public_subnet_id)" >> "$GITHUB_OUTPUT"
          echo "private_route_table_id=$(terraform output -raw private_route_table_id)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Allocate Elastic IP
      # --------------------------------------------------------

      - name: Allocate Elastic IP
        id: eip
        run: |
          ALLOCATION_ID=$(aws ec2 allocate-address \
            --domain vpc \
            --region "$AWS_REGION" \
            --query "AllocationId" \
            --output text)

          echo "Elastic IP Allocation ID: $ALLOCATION_ID"

          echo "allocation_id=$ALLOCATION_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Create NAT Gateway
      # --------------------------------------------------------

      - name: Create NAT Gateway
        id: nat
        env:
          PUBLIC_SUBNET_ID: ${{ steps.network.outputs.public_subnet_id }}
          ALLOCATION_ID: ${{ steps.eip.outputs.allocation_id }}
        run: |
          NAT_GATEWAY_ID=$(aws ec2 create-nat-gateway \
            --subnet-id "$PUBLIC_SUBNET_ID" \
            --allocation-id "$ALLOCATION_ID" \
            --region "$AWS_REGION" \
            --tag-specifications \
            'ResourceType=natgateway,Tags=[{Key=Name,Value=temporary-github-actions-nat}]' \
            --query "NatGateway.NatGatewayId" \
            --output text)

          echo "NAT Gateway ID: $NAT_GATEWAY_ID"

          echo "nat_gateway_id=$NAT_GATEWAY_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Wait for NAT
      # --------------------------------------------------------

      - name: Wait for NAT Gateway
        env:
          NAT_GATEWAY_ID: ${{ steps.nat.outputs.nat_gateway_id }}
        run: |
          echo "Waiting for NAT Gateway to become available..."

          aws ec2 wait nat-gateway-available \
            --nat-gateway-ids "$NAT_GATEWAY_ID" \
            --region "$AWS_REGION"

          echo "NAT Gateway is available."

      # --------------------------------------------------------
      # Add NAT route
      # --------------------------------------------------------

      - name: Add Temporary NAT Route
        env:
          NAT_GATEWAY_ID: ${{ steps.nat.outputs.nat_gateway_id }}
          PRIVATE_ROUTE_TABLE_ID: ${{ steps.network.outputs.private_route_table_id }}
        run: |
          aws ec2 create-route \
            --route-table-id "$PRIVATE_ROUTE_TABLE_ID" \
            --destination-cidr-block 0.0.0.0/0 \
            --nat-gateway-id "$NAT_GATEWAY_ID" \
            --region "$AWS_REGION"

          echo "Private subnet now has temporary Internet access."


  # ============================================================
  # 4. INSTALL AWS CLI + DOCKER
  # ============================================================

  install-docker:
    name: Install AWS CLI and Docker on Private EC2
    runs-on: ubuntu-latest

    needs:
      - temporary-nat

    outputs:
      instance_id: ${{ steps.ec2.outputs.instance_id }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Get EC2 Instance ID
        id: ec2
        working-directory: terraform
        run: |
          INSTANCE_ID=$(terraform output -raw ec2_instance_id)

          echo "EC2 Instance ID: $INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Install AWS CLI and Docker
      # --------------------------------------------------------

      - name: Install AWS CLI and Docker using SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Install AWS CLI and Docker on private EC2" \
            --parameters 'commands=[
              "set -e",
              "echo Checking operating system",
              "cat /etc/os-release",
              "echo Updating Ubuntu packages",
              "sudo apt-get update -y",
              "echo Installing AWS CLI and Docker",
              "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y awscli docker.io",
              "echo Enabling Docker",
              "sudo systemctl enable docker",
              "echo Starting Docker",
              "sudo systemctl start docker",
              "echo AWS CLI version",
              "aws --version",
              "echo Docker version",
              "sudo docker --version",
              "echo Docker service status",
              "sudo systemctl is-active docker"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      # --------------------------------------------------------
      # Verify installation
      # --------------------------------------------------------

      - name: Verify AWS CLI and Docker
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify AWS CLI and Docker" \
            --parameters 'commands=[
              "aws --version",
              "sudo docker --version",
              "sudo systemctl is-active docker"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Verification Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"


  # ============================================================
  # 5. REMOVE TEMPORARY NAT
  # ============================================================

  remove-nat:
    name: Remove Temporary NAT
    runs-on: ubuntu-latest

    needs:
      - temporary-nat
      - install-docker

    if: always()

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Get Private Route Table
        id: network
        working-directory: terraform
        run: |
          echo "private_route_table_id=$(terraform output -raw private_route_table_id)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Remove NAT route
      # --------------------------------------------------------

      - name: Remove NAT Route
        env:
          PRIVATE_ROUTE_TABLE_ID: ${{ steps.network.outputs.private_route_table_id }}
        run: |

          aws ec2 delete-route \
            --route-table-id "$PRIVATE_ROUTE_TABLE_ID" \
            --destination-cidr-block 0.0.0.0/0 \
            --region "$AWS_REGION" || true

          echo "Temporary NAT route removed."

      # --------------------------------------------------------
      # Delete NAT Gateway
      # --------------------------------------------------------

      - name: Delete NAT Gateway
        env:
          NAT_GATEWAY_ID: ${{ needs.temporary-nat.outputs.nat_gateway_id }}
        run: |

          if [ -n "$NAT_GATEWAY_ID" ]; then

            echo "Deleting NAT Gateway: $NAT_GATEWAY_ID"

            aws ec2 delete-nat-gateway \
              --nat-gateway-id "$NAT_GATEWAY_ID" \
              --region "$AWS_REGION"

            echo "Waiting for NAT Gateway deletion..."

            aws ec2 wait nat-gateway-deleted \
              --nat-gateway-ids "$NAT_GATEWAY_ID" \
              --region "$AWS_REGION"

            echo "NAT Gateway deleted."

          else

            echo "No NAT Gateway ID found."

          fi

      # --------------------------------------------------------
      # Release Elastic IP
      # --------------------------------------------------------

      - name: Release Elastic IP
        env:
          ALLOCATION_ID: ${{ needs.temporary-nat.outputs.allocation_id }}
        run: |

          if [ -n "$ALLOCATION_ID" ]; then

            echo "Releasing Elastic IP: $ALLOCATION_ID"

            aws ec2 release-address \
              --allocation-id "$ALLOCATION_ID" \
              --region "$AWS_REGION"

            echo "Elastic IP released."

          else

            echo "No Elastic IP allocation ID found."

          fi


  # ============================================================
  # 6. DEPLOY NGINX
  # ============================================================

  deploy-ec2:
    name: Deploy NGINX to Private EC2
    runs-on: ubuntu-latest

    needs:
      - push-nginx
      - install-docker
      - remove-nat

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # --------------------------------------------------------
      # Get EC2 ID
      # --------------------------------------------------------

      - name: Get EC2 Instance ID
        id: ec2
        working-directory: terraform
        run: |
          INSTANCE_ID=$(terraform output -raw ec2_instance_id)

          echo "EC2 Instance ID: $INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Get ECR URL
      # --------------------------------------------------------

      - name: Get ECR Repository URL
        id: ecr
        working-directory: terraform
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)

          echo "ECR Repository URL: $ECR_URL"

          echo "repository_url=$ECR_URL" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Deploy NGINX
      # --------------------------------------------------------

      - name: Deploy NGINX using SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          ECR_URL: ${{ steps.ecr.outputs.repository_url }}
        run: |

          ECR_REGISTRY=$(echo "$ECR_URL" | cut -d/ -f1)

          echo "ECR Registry: $ECR_REGISTRY"
          echo "ECR Repository: $ECR_URL"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NGINX from private ECR" \
            --parameters "commands=[
              \"set -e\",
              \"echo Logging into ECR\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"echo Pulling NGINX image\",
              \"sudo docker pull $ECR_URL:$IMAGE_TAG\",
              \"echo Removing previous NGINX container if present\",
              \"sudo docker stop nginx || true\",
              \"sudo docker rm nginx || true\",
              \"echo Starting NGINX container\",
              \"sudo docker run -d --name nginx -p 80:80 $ECR_URL:$IMAGE_TAG\",
              \"echo NGINX container started\",
              \"sudo docker ps --filter name=nginx\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      # --------------------------------------------------------
      # Verify NGINX
      # --------------------------------------------------------

      - name: Verify NGINX
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify NGINX container" \
            --parameters 'commands=[
              "sudo docker ps --filter name=nginx",
              "sudo docker inspect nginx --format \"{{.State.Status}}\"",
              "curl -I http://localhost:80"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Verification Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      # --------------------------------------------------------
      # Get ALB URL
      # --------------------------------------------------------

      - name: Get ALB URL
        id: alb
        working-directory: terraform
        run: |
          ALB_URL=$(terraform output -raw alb_url)

          echo "ALB URL: $ALB_URL"

          echo "alb_url=$ALB_URL" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Complete
      # --------------------------------------------------------

      - name: Deployment complete
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          ALB_URL: ${{ steps.alb.outputs.alb_url }}
        run: |
          echo ""
          echo "=========================================="
          echo "       NGINX DEPLOYMENT COMPLETED"
          echo "=========================================="
          echo ""
          echo "Private EC2: $INSTANCE_ID"
          echo "NAT Gateway: Removed"
          echo ""
          echo "Access NGINX using the ALB:"
          echo "$ALB_URL"
          echo ""
          echo "=========================================="
```
