name: Deploy NGINX to Private EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-nginx
  IMAGE_TAG: latest

jobs:

  infrastructure:
    name: Create Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve


  push-nginx:
    name: Push NGINX to ECR
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push NGINX
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull nginx:latest
          docker tag nginx:latest "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  temporary-nat:
    name: Create Temporary NAT
    runs-on: ubuntu-latest
    needs: infrastructure

    outputs:
      nat_gateway_id: ${{ steps.nat.outputs.nat_gateway_id }}
      allocation_id: ${{ steps.eip.outputs.allocation_id }}
      private_route_table_id: ${{ steps.network.outputs.private_route_table_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Network Information
        id: network
        working-directory: terraform
        run: |
          terraform init
          echo "public_subnet_id=$(terraform output -raw public_subnet_id)" >> "$GITHUB_OUTPUT"
          echo "private_route_table_id=$(terraform output -raw private_route_table_id)" >> "$GITHUB_OUTPUT"

      - name: Allocate Elastic IP
        id: eip
        run: |
          ALLOCATION_ID=$(aws ec2 allocate-address \
            --domain vpc \
            --region "$AWS_REGION" \
            --query "AllocationId" \
            --output text)

          echo "allocation_id=$ALLOCATION_ID" >> "$GITHUB_OUTPUT"

      - name: Create NAT Gateway
        id: nat
        env:
          PUBLIC_SUBNET_ID: ${{ steps.network.outputs.public_subnet_id }}
          ALLOCATION_ID: ${{ steps.eip.outputs.allocation_id }}
        run: |
          NAT_GATEWAY_ID=$(aws ec2 create-nat-gateway \
            --subnet-id "$PUBLIC_SUBNET_ID" \
            --allocation-id "$ALLOCATION_ID" \
            --region "$AWS_REGION" \
            --query "NatGateway.NatGatewayId" \
            --output text)

          echo "nat_gateway_id=$NAT_GATEWAY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for NAT Gateway
        env:
          NAT_GATEWAY_ID: ${{ steps.nat.outputs.nat_gateway_id }}
        run: |
          aws ec2 wait nat-gateway-available \
            --nat-gateway-ids "$NAT_GATEWAY_ID" \
            --region "$AWS_REGION"

      - name: Add NAT Route
        env:
          NAT_GATEWAY_ID: ${{ steps.nat.outputs.nat_gateway_id }}
          PRIVATE_ROUTE_TABLE_ID: ${{ steps.network.outputs.private_route_table_id }}
        run: |
          aws ec2 create-route \
            --route-table-id "$PRIVATE_ROUTE_TABLE_ID" \
            --destination-cidr-block 0.0.0.0/0 \
            --nat-gateway-id "$NAT_GATEWAY_ID" \
            --region "$AWS_REGION"


  install-docker:
    name: Install AWS CLI and Docker
    runs-on: ubuntu-latest
    needs: temporary-nat

    outputs:
      instance_id: ${{ steps.ec2.outputs.instance_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get EC2 Instance ID
        id: ec2
        working-directory: terraform
        run: |
          terraform init
          echo "instance_id=$(terraform output -raw ec2_instance_id)" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI and Docker
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo apt-get update -y",
              "sudo DEBIAN_FRONTEND=noninteractive apt-get install -y awscli docker.io",
              "sudo systemctl enable docker",
              "sudo systemctl start docker"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"


  deploy-ec2:
    name: Deploy NGINX to Private EC2
    runs-on: ubuntu-latest

    needs:
      - push-nginx
      - install-docker

    outputs:
      alb_url: ${{ steps.alb.outputs.alb_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get EC2 and ECR Information
        id: resources
        working-directory: terraform
        run: |
          terraform init
          echo "instance_id=$(terraform output -raw ec2_instance_id)" >> "$GITHUB_OUTPUT"
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Deploy NGINX
        env:
          INSTANCE_ID: ${{ steps.resources.outputs.instance_id }}
          ECR_URL: ${{ steps.resources.outputs.ecr_url }}
        run: |
          ECR_REGISTRY="${ECR_URL%%/*}"

          COMMANDS=$(jq -nc \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg image "$ECR_URL:$IMAGE_TAG" \
            '{
              commands: [
                "set -e",
                ("aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $registry),
                ("sudo docker pull " + $image),
                "sudo docker stop nginx || true",
                "sudo docker rm nginx || true",
                ("sudo docker run -d --name nginx -p 80:80 " + $image)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"

      - name: Verify NGINX
        env:
          INSTANCE_ID: ${{ steps.resources.outputs.instance_id }}
        run: |
          COMMANDS=$(jq -nc '{
            commands: [
              "set -e",
              "test \"$(sudo docker inspect nginx --format \"{{.State.Status}}\")\" = \"running\"",
              "curl -f http://localhost:80"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"

      - name: Get ALB URL
        id: alb
        working-directory: terraform
        run: |
          echo "alb_url=$(terraform output -raw alb_url)" >> "$GITHUB_OUTPUT"

      - name: Publish ALB URL
        env:
          ALB_URL: ${{ steps.alb.outputs.alb_url }}
        run: |
          echo "## NGINX Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NGINX URL: $ALB_URL" >> "$GITHUB_STEP_SUMMARY"


  remove-nat:
    name: Remove Temporary NAT
    runs-on: ubuntu-latest

    needs:
      - temporary-nat
      - deploy-ec2

    if: always()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove NAT Route
        env:
          PRIVATE_ROUTE_TABLE_ID: ${{ needs.temporary-nat.outputs.private_route_table_id }}
        run: |
          if [ -n "$PRIVATE_ROUTE_TABLE_ID" ]; then
            aws ec2 delete-route \
              --route-table-id "$PRIVATE_ROUTE_TABLE_ID" \
              --destination-cidr-block 0.0.0.0/0 \
              --region "$AWS_REGION" || true
          fi

      - name: Delete NAT Gateway
        env:
          NAT_GATEWAY_ID: ${{ needs.temporary-nat.outputs.nat_gateway_id }}
        run: |
          if [ -n "$NAT_GATEWAY_ID" ]; then
            aws ec2 delete-nat-gateway \
              --nat-gateway-id "$NAT_GATEWAY_ID" \
              --region "$AWS_REGION"

            aws ec2 wait nat-gateway-deleted \
              --nat-gateway-ids "$NAT_GATEWAY_ID" \
              --region "$AWS_REGION"
          fi

      - name: Release Elastic IP
        env:
          ALLOCATION_ID: ${{ needs.temporary-nat.outputs.allocation_id }}
        run: |
          if [ -n "$ALLOCATION_ID" ]; then
            aws ec2 release-address \
              --allocation-id "$ALLOCATION_ID" \
              --region "$AWS_REGION"
          fi
